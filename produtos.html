<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Produtos | CamisetasCSS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#f5f5f7;
color:#111;
}

header{
background:white;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:28px;
font-weight:700;
color:#0B7A3E;
}

nav a{
text-decoration:none;
color:#111;
margin-left:20px;
font-weight:600;
}

.hero{
padding:70px 8%;
text-align:center;
}

.hero h1{
font-size:55px;
margin-bottom:15px;
}

.hero p{
color:#666;
font-size:18px;
}

.search-box{
max-width:600px;
margin:40px auto;
}

.search-box input{
width:100%;
padding:16px;
font-size:18px;
border:1px solid #ddd;
border-radius:12px;
}

.products{
padding:40px 8%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,.08);
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
}

.card img{
width:100%;
height:300px;
object-fit:cover;
}

.content{
padding:20px;
}

.content h3{
font-size:24px;
margin-bottom:10px;
}

.price{
font-size:26px;
font-weight:bold;
color:#0B7A3E;
margin-bottom:15px;
}

button{
width:100%;
padding:12px;
border:none;
background:#111;
color:white;
border-radius:10px;
cursor:pointer;
font-size:16px;
font-weight:bold;
}

button:hover{
background:#0B7A3E;
}

footer{
background:#111;
color:white;
text-align:center;
padding:40px;
margin-top:50px;
}

</style>
</head>

<body>

<header>

<div class="logo">⚽ CamisetasCSS</div>

<nav>
<a href="index.html">Início</a>
<a href="carrinho.html">Carrinho</a>
<a href="rastreio.html">Rastreio</a>
<a href="contato.html">Contato</a>
</nav>

</header>

<section class="hero">

<h1>Catálogo Europeu</h1>

<p>Escolha sua camisa favorita.</p>

<div class="search-box">
<input
type="text"
id="search"
placeholder="Pesquisar clube..."
onkeyup="filtrar()">
</div>

</section>

<section class="products" id="produtos">

<div class="card">
<img src="https://picsum.photos/600/600?1">
<div class="content">
<h3>Real Madrid</h3>
<div class="price">R$ 149,90</div>
<button onclick="adicionar('Real Madrid',149.90)">
Adicionar ao Carrinho
</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/600/600?2">
<div class="content">
<h3>Barcelona</h3>
<div class="price">R$ 149,90</div>
<button onclick="adicionar('Barcelona',149.90)">
Adicionar ao Carrinho
</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/600/600?3">
<div class="content">
<h3>Liverpool</h3>
<div class="price">R$ 149,90</div>
<button onclick="adicionar('Liverpool',149.90)">
Adicionar ao Carrinho
</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/600/600?4">
<div class="content">
<h3>Manchester City</h3>
<div class="price">R$ 149,90</div>
<button onclick="adicionar('Manchester City',149.90)">
Adicionar ao Carrinho
</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/600/600?5">
<div class="content">
<h3>PSG</h3>
<div class="price">R$ 149,90</div>
<button onclick="adicionar('PSG',149.90)">
Adicionar ao Carrinho
</button>
</div>
</div>

<div class="card">
<img src="https://picsum.photos/600/600?6">
<div class="content">
<h3>Bayern Munich</h3>
<div class="price">R$ 149,90</div>
<button onclick="adicionar('Bayern Munich',149.90)">
Adicionar ao Carrinho
</button>
</div>
</div>

</section>

<footer>

<p>© 2026 CamisetasCSS</p>

</footer>

<script>

function filtrar(){

let busca =
document.getElementById("search")
.value
.toLowerCase();

let cards =
document.querySelectorAll(".card");

cards.forEach(card=>{

let nome =
card.querySelector("h3")
.innerText
.toLowerCase();

if(nome.includes(busca)){
card.style.display="block";
}
else{
card.style.display="none";
}

});

}

function adicionar(nome,preco){

let carrinho =
JSON.parse(localStorage.getItem("carrinho")) || [];

carrinho.push({
nome:nome,
preco:preco
});

localStorage.setItem(
"carrinho",
JSON.stringify(carrinho)
);

alert(nome + " adicionado ao carrinho!");

}

</script>

</body>
</html>
