<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contato | CamisetasCSS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#f5f5f7;
color:#111;
}

header{
background:white;
padding:20px 8%;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
font-size:30px;
font-weight:bold;
color:#0B7A3E;
}

.container{
max-width:800px;
margin:50px auto;
padding:20px;
}

h1{
margin-bottom:20px;
font-size:40px;
}

p{
margin-bottom:30px;
color:#666;
}

form{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

input, textarea{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:16px;
}

button{
width:100%;
padding:15px;
border:none;
background:#0B7A3E;
color:white;
font-size:18px;
font-weight:bold;
border-radius:10px;
cursor:pointer;
}

.info{
margin-top:40px;
background:white;
padding:25px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.info h3{
margin-bottom:15px;
}

</style>
</head>

<body>

<header>
<div class="logo">⚽ CamisetasCSS</div>
</header>

<div class="container">

<h1>Entre em Contato</h1>

<p>
Tem alguma dúvida? Entre em contato conosco.
</p>

<form>

<input type="text" placeholder="Seu nome">

<input type="email" placeholder="Seu e-mail">

<textarea rows="6" placeholder="Digite sua mensagem"></textarea>

<button type="submit">
Enviar Mensagem
</button>

</form>

<div class="info">

<h3>📱 WhatsApp</h3>
<p>(44) 99999-9999</p>

<h3>📷 Instagram</h3>
<p>@camisetascss</p>

<h3>✉️ E-mail</h3>
<p>contato@camisetascss.com</p>

</div>

</div>

</body>
</html>
