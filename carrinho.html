<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Carrinho | CamisetasCSS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#f5f5f7;
}

header{
background:white;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
font-size:28px;
font-weight:bold;
color:#0B7A3E;
}

.container{
max-width:1000px;
margin:50px auto;
padding:20px;
}

h1{
margin-bottom:30px;
}

.item{
background:white;
padding:20px;
margin-bottom:15px;
border-radius:15px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.total{
font-size:28px;
font-weight:bold;
margin-top:30px;
}

button{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:bold;
}

.remover{
background:#c62828;
color:white;
}

.whatsapp{
background:#0B7A3E;
color:white;
margin-top:20px;
width:100%;
padding:15px;
font-size:18px;
}

.limpar{
background:#111;
color:white;
margin-top:10px;
width:100%;
padding:15px;
}

</style>
</head>
<body>

<header>
<div class="logo">⚽ CamisetasCSS</div>
</header>

<div class="container">

<h1>Seu Carrinho</h1>

<div id="lista"></div>

<div class="total" id="total"></div>

<button class="whatsapp" onclick="finalizar()">
Finalizar Pedido no WhatsApp
</button>

<button class="limpar" onclick="limparCarrinho()">
Limpar Carrinho
</button>

</div>

<script>

let carrinho =
JSON.parse(localStorage.getItem("carrinho")) || [];

function carregar(){

let lista =
document.getElementById("lista");

lista.innerHTML="";

let total = 0;

carrinho.forEach((item,index)=>{

total += item.preco;

lista.innerHTML += `
<div class="item">
<div>
<h3>${item.nome}</h3>
<p>R$ ${item.preco.toFixed(2)}</p>
</div>

<button class="remover"
onclick="remover(${index})">
Remover
</button>

</div>
`;

});

document.getElementById("total")
.innerHTML =
"Total: R$ " + total.toFixed(2);

}

function remover(index){

carrinho.splice(index,1);

localStorage.setItem(
"carrinho",
JSON.stringify(carrinho)
);

carregar();

}

function limparCarrinho(){

localStorage.removeItem("carrinho");

carrinho=[];

carregar();

}

function finalizar(){

if(carrinho.length===0){

alert("Seu carrinho está vazio!");

return;

}

let mensagem =
"Olá! Gostaria de fazer um pedido:%0A%0A";

let total = 0;

carrinho.forEach(item=>{

mensagem +=
"- " + item.nome +
" | R$ " +
item.preco.toFixed(2) +
"%0A";

total += item.preco;

});

mensagem +=
"%0A💰 Total: R$ " +
total.toFixed(2);

window.open(
"https://wa.me/5544999999999?text="+mensagem
);

}

carregar();

</script>

</body>
</html>
