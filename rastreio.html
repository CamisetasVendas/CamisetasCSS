<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreio | CamisetasCSS</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
background:#f5f5f7;
color:#111;
}

header{
background:white;
padding:20px 8%;
box-shadow:0 2px 10px rgba(0,0,0,.08);
}

.logo{
font-size:30px;
font-weight:bold;
color:#0B7A3E;
}

.container{
max-width:800px;
margin:60px auto;
padding:20px;
text-align:center;
}

h1{
font-size:42px;
margin-bottom:15px;
}

p{
color:#666;
margin-bottom:30px;
}

.box{
background:white;
padding:40px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
}

input{
width:100%;
padding:15px;
font-size:18px;
border:1px solid #ddd;
border-radius:10px;
margin-bottom:15px;
}

button{
width:100%;
padding:15px;
border:none;
background:#0B7A3E;
color:white;
font-size:18px;
font-weight:bold;
border-radius:10px;
cursor:pointer;
}

.resultado{
margin-top:25px;
font-size:18px;
font-weight:600;
}

</style>
</head>

<body>

<header>
<div class="logo">⚽ CamisetasCSS</div>
</header>

<div class="container">

<h1>Rastreie seu Pedido</h1>

<p>Digite o código de rastreio enviado pela loja.</p>

<div class="box">

<input
type="text"
id="codigo"
placeholder="Ex: CSS123456">

<button onclick="rastrear()">
Consultar
</button>

<div id="resultado" class="resultado"></div>

</div>

</div>

<script>

function rastrear(){

let codigo =
document.getElementById("codigo").value;

let resultado =
document.getElementById("resultado");

if(codigo === ""){

resultado.innerHTML =
"Digite um código de rastreio.";

return;

}

resultado.innerHTML =
"📦 Pedido localizado. Em trânsito para o destino.";

}

</script>

</body>
</html>
